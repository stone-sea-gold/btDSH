# P0-G4 spike 的 preset 组成。
# 最终方案里这里会是：量化助手的人格 + 提示词段 + 本 preset 作用域内的 quant_* 工具行 + 技能目录。
# spike 阶段只保留最小可解析的组成，验证「物化 → roster 可见 → 可挂载」这条路径。
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: |-
      你是「量化助手」（P0 骨架）。
      当前是可行性验证阶段：只验证安装、preset 投递与工具面是否打通，不提供投资建议。
    suffix: Your working directory is {{cwd}}.
